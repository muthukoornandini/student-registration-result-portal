<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration & Result Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-4">
    <h2 class="text-center mb-4">Student Registration & Result Portal</h2>
    <form id="studentForm" class="card p-4 shadow">
      <div class="mb-3">
        <label for="name" class="form-label">Student Name</label>
        <input type="text" id="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="course" class="form-label">Course</label>
        <select id="course" class="form-select" required>
          <option value="">Select Course</option>
          <option value="BSc Computer Science">BSc Computer Science</option>
          <option value="BCom">BCom</option>
          <option value="BA English">BA English</option>
        </select>
      </div>
      <div id="marksSection" class="mb-3">
        <label class="form-label">Enter Marks (out of 100)</label>
        <input type="number" class="form-control mb-2 subject-mark" placeholder="Subject 1" required>
        <input type="number" class="form-control mb-2 subject-mark" placeholder="Subject 2" required>
        <input type="number" class="form-control mb-2 subject-mark" placeholder="Subject 3" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>

    <div id="resultSection" class="mt-4">
      <h4>Results</h4>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Total Marks</th>
            <th>Percentage</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="resultTable"></tbody>
      </table>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
